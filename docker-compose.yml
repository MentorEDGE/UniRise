# Local services for day-to-day coding. AWS (RDS, S3, SES) is the shared dev environment; this keeps the inner loop fast and offline.
# Everything listens on 127.0.0.1 only. Copy .env.example to .env first.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: unirise
      POSTGRES_USER: unirise
      POSTGRES_PASSWORD: ${RMS_DB_PASSWORD:?Set RMS_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unirise -d unirise"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio: # S3-compatible store for uploads and exports
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-unirise}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]

  mailpit: # catches outgoing mail; open http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  api: # the backend itself: docker compose --profile api up --build
    profiles: ["api"]
    build: ./unirise-api
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      CONTROL_DB_URL: jdbc:postgresql://postgres:5432/unirise
      CONTROL_DB_USER: unirise
      RMS_DB_PASSWORD: ${RMS_DB_PASSWORD:?Set RMS_DB_PASSWORD in .env}
      TENANT_DB_HOST: postgres
      TENANT_DB_PORT: "5432"
      RMS_ADMIN_KEY: ${RMS_ADMIN_KEY:?Set RMS_ADMIN_KEY in .env}
    ports: ["127.0.0.1:8081:8080"]

volumes:
  pgdata:
  miniodata:
