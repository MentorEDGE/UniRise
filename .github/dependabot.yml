# Dependabot (2026-11-24, free): weekly checks for outdated or vulnerable dependencies in the API (Maven), the website
# (npm) and the GitHub workflows, opened as pull requests against dev. Security alerts also appear under the
# repository's Security tab once "Dependabot alerts" is switched on in Settings → Code security.
version: 2
updates:
  - package-ecosystem: maven
    directory: /unirise-api
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /rdms-web
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
