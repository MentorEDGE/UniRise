# Test-wide settings (loaded after the main application.properties). Two-step sign-in is switched off for the general
# suite, which signs the same accounts in many times a minute; TwoStepTest switches it on and tests it fully. The
# breached-password service is not called from tests (BreachedPasswordsTest covers it with a stand-in).
app.security.two-step-roles=
app.security.breached-passwords-url=
