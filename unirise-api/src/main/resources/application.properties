spring.application.name=unirise-api
# Flyway is run in code (control plane at start, tenants by the migrator), not by auto-configuration.
spring.flyway.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health

# Control-plane database. Local default is the docker-compose Postgres.
app.control.url=${CONTROL_DB_URL:jdbc:postgresql://localhost:5432/unirise}
app.control.user=${CONTROL_DB_USER:unirise}
app.control.password=${RMS_DB_PASSWORD:}
# Where new tenant databases are created. Needs a login that may CREATE ROLE / CREATE DATABASE (the control-plane login locally).
app.tenants.host=${TENANT_DB_HOST:localhost}
app.tenants.port=${TENANT_DB_PORT:5432}
app.tenants.max-pool-size=5
app.tenants.max-open-pools=50
app.tenants.migrate-concurrency=4
# Platform operator key for /api/platform/**. Endpoint is disabled when empty.
app.admin-key=${RMS_ADMIN_KEY:}
# Spring's own database check is off (it would probe the tenant routing data source); ControlDatabaseHealth checks the
# control-plane database instead, on /actuator/health and in the readiness group. Liveness stays process-only.
management.health.db.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,controlDatabase
# Days a tenant stays read-only in "closing" before its database may be dropped (contract exit, TRD 9a).
app.tenants.retention-days=${TENANT_RETENTION_DAYS:30}
# Extra JDBC URL parameters for tenant databases, for example sslmode=require on RDS (which forces TLS). Empty locally.
app.tenants.jdbc-params=${TENANT_DB_JDBC_PARAMS:}
# Behind the AWS load balancer: take the client's address from X-Forwarded-For, trusted only when the request comes from a
# private-network proxy (Tomcat's default internal ranges), so sign-in limits count per person and not per load balancer.
server.forward-headers-strategy=native
# The session cookie is Secure (sent over HTTPS only). Set SESSION_SECURE_COOKIE=false only for plain-HTTP local runs.
app.session.secure-cookie=${SESSION_SECURE_COOKIE:true}
# Where institution database passwords live (BACKEND_PLAN A2): "database" (the control-plane table; local runs and
# tests only) or "aws" (AWS Secrets Manager, one secret per institution named prefix + slug). On AWS: SECRETS_STORE=aws.
app.secrets.store=${SECRETS_STORE:database}
app.secrets.prefix=${SECRETS_PREFIX:unirise/local/tenant/}
# Record files (A1b): presigned uploads to and downloads from this private S3 bucket. Empty (local runs, tests unless
# set): uploads are off and the UI stores file names only. On AWS: UPLOADS_BUCKET=unirise-dev-uploads-<account>.
app.uploads.bucket=${UPLOADS_BUCKET:}
# Email (A1a): "Talk to our team" enquiries go to MAIL_ENQUIRIES_TO from MAIL_FROM through Amazon SES, with Reply-To
# set to the person who enquired. Empty (local runs, tests): enquiries are stored only.
app.mail.from=${MAIL_FROM:}
app.mail.enquiries-to=${MAIL_ENQUIRIES_TO:}
app.mail.configuration-set=${MAIL_CONFIGURATION_SET:}
