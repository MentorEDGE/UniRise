spring.application.name=unirise-api
# Flyway is run in code (control plane at start, tenants by the migrator), not by auto-configuration.
spring.flyway.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health

# Control-plane database. Local default is the docker-compose Postgres.
app.control.url=${CONTROL_DB_URL:jdbc:postgresql://localhost:5432/unirise}
app.control.user=${CONTROL_DB_USER:unirise}
app.control.password=${RMS_DB_PASSWORD:}
# Where new tenant databases are created. Needs a login that may CREATE ROLE / CREATE DATABASE (the control-plane login locally).
app.tenants.host=${TENANT_DB_HOST:localhost}
app.tenants.port=${TENANT_DB_PORT:5432}
app.tenants.max-pool-size=5
app.tenants.max-open-pools=50
app.tenants.migrate-concurrency=4
# Platform operator key for /api/platform/**. Endpoint is disabled when empty.
app.admin-key=${RMS_ADMIN_KEY:}
management.health.db.enabled=false
